<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PaaS Worker Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">NEO Queue · NATS JetStream</p>
      <h1>Public worker test</h1>
      <p>Submit a demonstration job and watch a private NEO Worker process it. Progress is stored in NEO DB, so it survives web restarts and scaling.</p>
      <form id="task-form">
        <label for="duration">Duration in seconds</label>
        <input id="duration" name="duration" type="number" min="1" max="60" value="10" required>
        <div id="token-container" hidden>
          <label for="token">Testing access token</label>
          <input id="token" name="token" type="password" autocomplete="off" placeholder="Enter TEST_SUBMIT_TOKEN">
        </div>
        <button id="submit-button" type="submit">Start background task</button>
      </form>
      <p id="status" role="status" aria-live="polite">Status: Idle</p>
    </main>
  </body>
</html>
